# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Ascent from Avernus
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: extendon64.github.io/avernus
  # Belt and braces: these never reach the build at all.
  # explicit-publish (below) is the real gate; this is the second lock.
  ignorePatterns:
    - DM
    - DM/**
    - _templates
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # IM Fell English ships a 400 cut only (roman + italic). The header slot otherwise
      # defaults to requesting weights [400, 700]; Google Fonts errors on a weight that
      # does not exist, and that would take body and code down with it since they share
      # one URL. Hence the explicit object form.
      #
      # Cinzel (section rules) and IM Fell's italic are loaded by a second <link> in
      # quartz/components/Head.tsx, because theme.ts builds its URL from this block alone.
      header:
        name: IM Fell English
        weights: [400]
      body: Source Sans Pro
      code: IBM Plex Mono
    # "Nightwatch": charcoal plum with brass, dark-led.
    # The infernal palette is deliberately NOT derived from these, see custom.scss.
    colors:
      lightMode:
        light: "#f1eff2"
        lightgray: "#dcd8de"
        gray: "#9a94a0"
        darkgray: "#3e3843"
        dark: "#1e1a22"
        secondary: "#6b3a52"
        tertiary: "#9b6a3f"
        highlight: rgba(107, 58, 82, 0.09)
        textHighlight: "#cfa85e88"
      darkMode:
        light: "#16121a"
        lightgray: "#302838"
        gray: "#5e5468"
        darkgray: "#d4ccdc"
        dark: "#f0eaf4"
        secondary: "#c9a24a"
        tertiary: "#e0b968"
        highlight: rgba(201, 162, 74, 0.12)
        textHighlight: "#8a6a2088"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  # This plugin resolves the h1-h6 / interface font variables, and will ALSO emit its
  # own Google Fonts <link> if left alone. Its `useThemeFonts` reads the quartz-themes
  # registry, NOT theme.typography above, so with that plugin disabled it falls through
  # to its own default header face (Schibsted Grotesk). Set the faces explicitly, and
  # use fontOrigin: local so it does not emit a second, duplicate font link. Head.tsx
  # already loads all four faces.
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header: IM Fell English
      body: Source Sans Pro
      code: IBM Plex Mono
      fontOrigin: local
  - source: github:quartz-community/remove-draft
    enabled: true
  # THE IMPORTANT ONE.
  # With this enabled, a note is published ONLY if its frontmatter says
  # publish: true. Forgetting the flag keeps a note private (fails safe).
  # Do not disable this. Ever.
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        # lowercase: Quartz slugifies, and mixed case only serves a meta-refresh stub
        Campaign Primer: https://extendon64.github.io/avernus/00-campaign/campaign-primer
        Safety Tools: https://extendon64.github.io/avernus/00-campaign/safety-tools
        Maps & tokens by TessaPresentsMaps: https://www.reddit.com/user/TessaPresentsMaps/
        Fan Content Policy: https://company.wizards.com/en/legal/fancontentpolicy
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
